version: 2.1

jobs:
  build:
    docker:
      - image: cimg/rust:1.90.0

    steps:
      - checkout
      - restore_cache:
          key: project-cache
      - run:
          name: Check formatting
          command: |
            rustfmt --version
            cargo fmt -- --check
      - run:
          name: Clippy
          command: cargo clippy --all-targets -- -D warnings
      - run:
          name: Stable Build
          command: cargo build --all-targets
      - run:
          name: Test
          command: cargo test
