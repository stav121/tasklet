[package]
name = "tasklet"
version = "0.4.1"
authors = ["Stavros Grigoriou <unix121@protonmail.com>"]
edition = "2021"
rust-version = "1.90.0"
license = "MIT"
repository = "https://github.com/stav121/tasklet"
readme = "README.md"
description = "An asynchronous task scheduling library"
keywords = ["cron", "scheduling", "tasks", "tasklet", "async"]

[dependencies]
cron = "0.15.0"
chrono = "0.4.42"
log = "0.4.29"
# Only the runtime pieces the library actually uses: spawning tasks, channels /
# Notify, timers and the `select!`/`pin!` macros. Downstream crates can enable
# more features themselves.
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "macros"] }
thiserror = "2.0.17"
# Small, dependency-free PRNG used only for retry backoff jitter.
fastrand = "2.3"
# Optional: enables `Serialize`/`Deserialize` on the observable state types
# (`TaskState`, `Status`, `StepState`, `RunRecord`, ...) behind the `serde` feature.
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
# Derive serde on the observable, read-only state types so a control plane / API can
# emit them. Pulls in `serde` and chrono's serde integration for the timestamps.
serde = ["dep:serde", "chrono/serde"]

[dev-dependencies]
simple_logger = "5.1.0"
tokio-test = "0.4.4"
# Used only by the `serde`-gated round-trip tests.
serde_json = "1.0"
# Examples and tests need the macros and a multi-thread runtime on top of the
# library's minimal feature set.
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
